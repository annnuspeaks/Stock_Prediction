name: Nexora CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-check:
    name: Project Foundation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f .gitignore
          test -f assets/Nexora_Stock_Prediction_Master_Checklist.md

      - name: CI success
        run: echo "Nexora CI foundation check passed successfully."